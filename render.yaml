databases:
  - name: cv-db
    plan: free
    databaseName: cv
    user: cv

services:
  - type: web
    name: cv-graphql-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cv-db
          property: connectionString
      - key: PROFILE_GITHUB_URL
        sync: false
      - key: PROJECT_REPOSITORY_URL
        sync: false
      - key: PROJECT_PUBLIC_URL
        sync: false
