services:
  db:
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv -d cv"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cv:cv@db:5432/cv?schema=public
      PORT: 3000
      PRISMA_LOG_QUERIES: ${PRISMA_LOG_QUERIES:-false}
      PROFILE_GITHUB_URL: ${PROFILE_GITHUB_URL:-}
      PROJECT_REPOSITORY_URL: ${PROJECT_REPOSITORY_URL:-}
      PROJECT_PUBLIC_URL: ${PROJECT_PUBLIC_URL:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
